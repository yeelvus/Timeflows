  <title>时钟</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .face {
      width: min(100vw, 100vh);
      height: min(100vw, 100vh);
      display: block;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
    }
    .hour-number {
      fill: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans", "Microsoft YaHei", sans-serif;
      font-size: 42px;
      font-weight: 500;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .minute-label {
      fill: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .minute-tick {
      stroke: #fff;
      stroke-width: 1.1;
      stroke-linecap: round;
      opacity: 0.36;
    }
    .hand-thin {
      fill: #fff;
    }
    .hand-fat {
      fill: #fff;
    }
    .second-hand {
      stroke: #FA9F22;
      stroke-width: 2.1;
      stroke-linecap: round;
    }
    .hub-outer {
      fill: #fff;
    }
    .hub-mid {
      fill: #FA9F22;
    }
    .hub-inner {
      fill: #000;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>

  <script>
    "use strict";

    // --- clock-angles:begin ---
    function getHandAnglesFromParts(hours, minutes, seconds) {
      var hour12 = ((Number(hours) % 12) + 12) % 12;
      var mins = Number(minutes);
      var secs = Number(seconds);
      return {
        hour: (hour12 + mins / 60 + secs / 3600) * 30,
        minute: (mins + secs / 60) * 6,
        second: secs * 6
      };
    }

    function getHandAngles(date) {
      return getHandAnglesFromParts(
        date.getHours(),
        date.getMinutes(),
        date.getSeconds() + date.getMilliseconds() / 1000
      );
    }
    // --- clock-angles:end ---

    function formatReadout(date) {
      var hours = date.getHours();
      var minutes = date.getMinutes();
      var seconds = date.getSeconds();
      var pad = function (n) {
        return n < 10 ? "0" + n : String(n);
      };
      return "模拟时钟，当前本地时间 " + pad(hours) + ":" + pad(minutes) + ":" + pad(seconds);
    }

    function applyHandRotation(element, degrees) {
      element.setAttribute("transform", "rotate(" + degrees + ")");
    }

    function createClock(root) {
      var hourHand = root.getElementById("hourHand");
      var minuteHand = root.getElementById("minuteHand");
      var secondHand = root.getElementById("secondHand");
      var readout = document.getElementById("timeReadout");
      var frameId = 0;
      var lastReadoutSecond = -1;

      function paint(date) {
        var angles = getHandAngles(date);
        applyHandRotation(hourHand, angles.hour);
        applyHandRotation(minuteHand, angles.minute);
        applyHandRotation(secondHand, angles.second);
        var secondStamp = date.getSeconds();
        if (secondStamp !== lastReadoutSecond) {
          lastReadoutSecond = secondStamp;
          readout.textContent = formatReadout(date);
        }
      }

      function tick() {
        paint(new Date());
        frameId = window.requestAnimationFrame(tick);
      }

      function syncNow() {
        paint(new Date());
      }

      function start() {
        if (frameId) {
          window.cancelAnimationFrame(frameId);
        }
        syncNow();
        frameId = window.requestAnimationFrame(tick);
      }

      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") {
          start();
        }
      });
      window.addEventListener("focus", start);
      window.addEventListener("pageshow", start);

      start();
    }

    createClock(document);
  </script>
